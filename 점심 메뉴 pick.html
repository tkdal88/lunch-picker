<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 양재 점심 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#EDEBE5;
    --text:#1A1A18;--text2:#6B6960;--text3:#A09D94;--border:#E0DDD5;
    --green:#2D6A4F;--green-bg:#D8F3DC;
    --yellow:#9B6A00;--yellow-bg:#FFF3CD;
    --orange:#C44B00;--orange-bg:#FFE8D6;
    --red:#B52C2C;--red-bg:#FDDEDE;
    --accent:#E8572A;
    --dessert:#7B5EA7;--dessert-bg:#EDE7F6;
    --hoesik:#1565C0;--hoesik-bg:#E3F2FD;
    --radius:12px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;}
  .container{max-width:900px;margin:0 auto;}
  .header{margin-bottom:2rem;}
  .header h1{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  .header h1 span{color:var(--accent);}
  .header p{font-size:13px;color:var(--text2);margin-top:4px;}

  .pick-section{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:2rem;}
  @media(max-width:680px){.pick-section{grid-template-columns:1fr;}}

  .pick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .pick-card-label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);font-family:'DM Mono',monospace;align-self:flex-start;}
  .pick-card-label.dessert-label{color:var(--dessert);}
  .pick-card-label.hoesik-label{color:var(--hoesik);}

  /* mascot */
  .mascot-wrap{position:relative;width:80px;height:80px;}
  .mascot-wrap svg{width:80px;height:80px;}
  .mascot-wrap.bounce{animation:mascotBounce 0.5s ease-in-out;}
  @keyframes mascotBounce{0%{transform:translateY(0)}25%{transform:translateY(-10px) rotate(-8deg)}60%{transform:translateY(-4px) rotate(5deg)}100%{transform:translateY(0)}}

  /* speech bubble — BELOW mascot */
  .speech-bubble{
    background:var(--surface2);border-radius:10px;padding:10px 14px;
    font-size:13px;font-weight:500;color:var(--text);line-height:1.5;
    border:1px solid var(--border);transition:all 0.2s;
    width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .speech-bubble::before{
    content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-bottom-color:var(--border);border-top:none;
  }
  .speech-bubble::after{
    content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    border:7px solid transparent;border-bottom-color:var(--surface2);border-top:none;
  }
  .speech-bubble.reveal{background:#fff8f5;border-color:var(--accent);}
  .speech-bubble.reveal::after{border-bottom-color:#fff8f5;}

  .pick-meta{font-size:12px;color:var(--text2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:22px;}
  .pick-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;transition:opacity 0.15s,transform 0.1s;}
  .pick-btn:active{transform:scale(0.97);}
  .pick-btn:disabled{opacity:0.5;cursor:default;}
  .pick-btn.lunch{background:var(--accent);color:white;}
  .pick-btn.lunch:hover:not(:disabled){opacity:0.88;}
  .pick-btn.dessert{background:var(--dessert);color:white;}
  .pick-btn.dessert:hover:not(:disabled){opacity:0.88;}
  .pick-btn.hoesik{background:var(--hoesik);color:white;}
  .pick-btn.hoesik:hover:not(:disabled){opacity:0.88;}

  .dist-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;}
  .d1{background:var(--green-bg);color:var(--green);}
  .d2{background:var(--yellow-bg);color:var(--yellow);}
  .d3{background:var(--orange-bg);color:var(--orange);}
  .d4{background:var(--red-bg);color:var(--red);}
  .dd{background:var(--dessert-bg);color:var(--dessert);}
  .dh{background:var(--hoesik-bg);color:var(--hoesik);}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0.75rem;}
  .filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.12s;}
  .filter-btn:hover{border-color:var(--text3);}
  .filter-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}

  .cat-tier{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center;}
  .cat-group-btn{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.12s;}
  .cat-group-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .cat-sub-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.12s;}
  .cat-sub-btn.active{border-color:var(--text);color:var(--text);background:var(--surface2);}

  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;flex-wrap:wrap;gap:8px;}
  .section-title{font-size:14px;font-weight:700;color:var(--text);}
  .count-badge{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.875rem 1rem;transition:border-color 0.12s;}
  .card:hover{border-color:var(--text3);}
  .card-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
  .card-cat{font-size:11px;color:var(--text2);margin-bottom:4px;}
  .card-menu{font-size:11px;color:var(--accent);margin-bottom:6px;font-weight:500;}
  .card-bottom{display:flex;align-items:center;gap:6px;}
  .card-dist-text{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
  .empty{text-align:center;padding:3rem;color:var(--text3);font-size:14px;}
  hr{border:none;border-top:1px solid var(--border);margin:2rem 0;}
  .divider-label{font-size:11px;font-weight:700;letter-spacing:0.08em;color:var(--dessert);text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:0.75rem;}
  .divider-label.hoesik-lbl{color:var(--hoesik);}
</style>
</head>
<body>

          <ellipse cx="51" cy="37" rx="4" ry="2.5" fill="#DDA0E8" opacity="0.6"/>

<script>

function deg2rad(d){return d*Math.PI/180;}
function calcDist(a,b){const R=6371000,dLat=deg2rad(b.lat-a.lat),dLng=deg2rad(b.lng-a.lng);const x=Math.sin(dLat/2)**2+Math.cos(deg2rad(a.lat))*Math.cos(deg2rad(b.lat))*Math.sin(dLng/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));}
function distClass(m){return m<=300?'d1':m<=500?'d2':m<=1000?'d3':'d4';}
function distLabel(c){return{d1:'🟢 300m 이내',d2:'🟡 300~500m',d3:'🟠 500m~1km',d4:'🔴 1km 이상'}[c];}
function walkMin(m){return Math.round(m/70);}

  {name:'금강수림',cat:'고기구이',menu:'주물럭·장어주물럭',type:'hoesik',lat:37.4854,lng:127.0372},
  {name:'곱창왕김형제',cat:'곱창·막창',menu:'곱창·막창',type:'hoesik',lat:37.4854,lng:127.0372},
  {name:'진여사댁',cat:'요리주점',menu:'요리주점',type:'hoesik',lat:37.4842,lng:127.0347},
  {name:'아리노마마',cat:'이자카야',menu:'이자카야·일식',type:'hoesik',lat:37.4849,lng:127.0356},
];

const data=raw.map(r=>{const m=calcDist(BASE,{lat:r.lat,lng:r.lng});return{...r,distM:m,distC:distClass(m)};});
const lunchData=data.filter(r=>r.type==='lunch');
const dessertData=data.filter(r=>r.type==='dessert');
const hoesikData=data.filter(r=>r.type==='hoesik');

const GROUPS=['전체','한식','일식','중식','양식','기타'];
const subCatMap={};
GROUPS.filter(g=>g!=='전체').forEach(g=>{subCatMap[g]=[...new Set(lunchData.filter(r=>r.group===g).map(r=>r.cat))].sort();});

let activeDist='all',activeCatGroup='all',activeCatSub='all';
let activeDessertDist='all',activeHoesikDist='all';

function buildCatFilters(){
  document.getElementById('cat-group-row').innerHTML=GROUPS.map(g=>`<button class="cat-group-btn${g==='전체'?' active':''}" onclick="setCatGroup('${g==='전체'?'all':g}',this)">${g}</button>`).join('');
  document.getElementById('cat-sub-row').innerHTML='';
}
function renderSubCats(group){
  const sr=document.getElementById('cat-sub-row');
  if(group==='all'){sr.innerHTML='';return;}
  sr.innerHTML=`<button class="cat-sub-btn active" onclick="setCatSub('all',this)">전체</button>`+(subCatMap[group]||[]).map(c=>`<button class="cat-sub-btn" onclick="setCatSub('${c}',this)">${c}</button>`).join('');
}
function setDist(d,el){activeDist=d;document.querySelectorAll('#dist-filters .filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderLunch();}
function setDessertDist(d,el){activeDessertDist=d;document.querySelectorAll('#dessert-dist-filters .filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderDessert();}
function setHoesikDist(d,el){activeHoesikDist=d;document.querySelectorAll('#hoesik-dist-filters .filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderHoesik();}
function setCatGroup(g,el){activeCatGroup=g;activeCatSub='all';document.querySelectorAll('#cat-group-row .cat-group-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderSubCats(g);renderLunch();}
function setCatSub(c,el){activeCatSub=c;document.querySelectorAll('#cat-sub-row .cat-sub-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderLunch();}

function filteredLunch(){return lunchData.filter(r=>(activeDist==='all'||r.distC===activeDist)&&(activeCatGroup==='all'||r.group===activeCatGroup)&&(activeCatSub==='all'||r.cat===activeCatSub)).sort((a,b)=>a.distM-b.distM);}
function filteredDessert(){return dessertData.filter(r=>activeDessertDist==='all'||r.distC===activeDessertDist).sort((a,b)=>a.distM-b.distM);}
function filteredHoesik(){return hoesikData.filter(r=>activeHoesikDist==='all'||r.distC===activeHoesikDist).sort((a,b)=>a.distM-b.distM);}

function cardHTML(r,bo){const bc=bo||r.distC;const bl=bo==='dd'?'☕ 디저트':bo==='dh'?'🍻 회식':distLabel(r.distC);return`<div class="card"><div class="card-name" title="${r.name}">${r.name}</div><div class="card-cat">${r.cat}</div><div class="card-menu">${r.menu}</div><div class="card-bottom"><span class="dist-badge ${bc}">${bl}</span><span class="card-dist-text">${r.distM}m</span></div></div>`;}
function renderLunch(){const l=filteredLunch();document.getElementById('lunch-count').textContent=`${l.length}개`;document.getElementById('lunch-grid').innerHTML=l.length?l.map(r=>cardHTML(r)).join(''):'<div class="empty">해당 조건의 식당이 없어요</div>';}
function renderDessert(){const l=filteredDessert();document.getElementById('dessert-count').textContent=`${l.length}개`;document.getElementById('dessert-grid').innerHTML=l.length?l.map(r=>cardHTML(r,'dd')).join(''):'<div class="empty">해당 조건의 카페가 없어요</div>';}
function renderHoesik(){const l=filteredHoesik();document.getElementById('hoesik-count').textContent=`${l.length}개`;document.getElementById('hoesik-grid').innerHTML=l.length?l.map(r=>cardHTML(r,'dh')).join(''):'<div class="empty">해당 조건의 회식 장소가 없어요</div>';}

const SUSPENSE=[
  ['두구...','두구두구...','두구두구두구...! 🥁'],
  ['과연 오늘의 선택은...','운명의 손길이...','결정됐습니다!! ✨'],
  ['에이~ 이건 좀...','그것도 아니고...','바로 이거야!! 🎯'],
  ['냐하...','냐하하...','냐하하하!! 😈'],
];

function animatePick(mwId,bubbleId,btnId,list,metaId){
  if(!list.length)return;
  const mw=document.getElementById(mwId);
  const bubble=document.getElementById(bubbleId);
  const btn=document.getElementById(btnId);
  btn.disabled=true;
  bubble.classList.remove('reveal');
  const seq=SUSPENSE[Math.floor(Math.random()*SUSPENSE.length)];
  let step=0;
  bubble.textContent=seq[0];
  mw.classList.add('bounce');
  setTimeout(()=>mw.classList.remove('bounce'),500);
  const iv=setInterval(()=>{
    step++;
    if(step<seq.length){
      bubble.textContent=seq[step];
      mw.classList.add('bounce');
      setTimeout(()=>mw.classList.remove('bounce'),500);
    } else {
      clearInterval(iv);
      const r=list[Math.floor(Math.random()*list.length)];
      bubble.classList.add('reveal');
      bubble.innerHTML=`<span style="font-weight:700;font-size:14px;">${r.name}</span><br><span style="font-size:11px;color:var(--text2)">${r.menu}</span>`;
      document.getElementById(metaId).innerHTML=`<span class="dist-badge ${r.distC}">${distLabel(r.distC)}</span><span style="font-size:11px;color:var(--text3)">도보 약 ${walkMin(r.distM)}분 (${r.distM}m)</span>`;
      mw.classList.add('bounce');
      setTimeout(()=>mw.classList.remove('bounce'),500);
      btn.disabled=false;
    }
  },650);
}

function pickLunch(){animatePick('mw-lunch','bubble-lunch','btn-lunch',filteredLunch(),'lunch-meta');}
function pickDessert(){animatePick('mw-dessert','bubble-dessert','btn-dessert',filteredDessert(),'dessert-meta');}
function pickHoesik(){animatePick('mw-hoesik','bubble-hoesik','btn-hoesik',filteredHoesik(),'hoesik-meta');}

buildCatFilters();renderLunch();renderDessert();renderHoesik();
</script>
</body>
</html>
