<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 양재 점심 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #EDEBE5;
    --text: #1A1A18;
    --text2: #6B6960;
    --text3: #A09D94;
    --border: #E0DDD5;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --yellow: #9B6A00;
    --yellow-bg: #FFF3CD;
    --orange: #C44B00;
    --orange-bg: #FFE8D6;
    --red: #B52C2C;
    --red-bg: #FDDEDE;
    --accent: #E8572A;
    --accent2: #F4A261;
    --dessert: #7B5EA7;
    --dessert-bg: #EDE7F6;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 860px; margin: 0 auto; }

  /* Header */
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 14px; color: var(--text2); margin-top: 4px; }

  /* Pick Cards */
  .pick-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 2rem; }
  @media (max-width: 600px) { .pick-section { grid-template-columns: 1fr; } }

  .pick-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    display: flex; flex-direction: column; gap: 10px;
  }
  .pick-card-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text3);
    font-family: 'DM Mono', monospace;
  }
  .pick-card-label.dessert-label { color: var(--dessert); }
  .pick-result {
    font-size: 20px; font-weight: 700; color: var(--text);
    min-height: 32px; line-height: 1.3;
  }
  .pick-meta {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: var(--text2);
  }
  .pick-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: var(--radius-sm);
    border: none; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px; font-weight: 500;
    transition: opacity 0.15s, transform 0.1s;
    width: fit-content;
  }
  .pick-btn:active { transform: scale(0.97); }
  .pick-btn.lunch { background: var(--accent); color: white; }
  .pick-btn.lunch:hover { opacity: 0.88; }
  .pick-btn.dessert { background: var(--dessert); color: white; }
  .pick-btn.dessert:hover { opacity: 0.88; }

  /* Dist badge */
  .dist-badge {
    display: inline-block; padding: 2px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 500;
  }
  .d1 { background: var(--green-bg); color: var(--green); }
  .d2 { background: var(--yellow-bg); color: var(--yellow); }
  .d3 { background: var(--orange-bg); color: var(--orange); }
  .d4 { background: var(--red-bg); color: var(--red); }
  .dd { background: var(--dessert-bg); color: var(--dessert); }

  /* Filters */
  .filter-row {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 0.75rem;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); font-size: 13px; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.12s;
  }
  .filter-btn:hover { border-color: var(--text3); }
  .filter-btn.active {
    background: var(--text); color: var(--bg);
    border-color: var(--text);
  }
  .cat-btn {
    padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text2); font-size: 12px; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.12s;
  }
  .cat-btn.active { border-color: var(--text); color: var(--text); background: var(--surface2); }

  /* Table section */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.75rem; flex-wrap: wrap; gap: 8px;
  }
  .section-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .count-badge {
    font-size: 12px; color: var(--text3);
    font-family: 'DM Mono', monospace;
  }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 0.875rem 1rem;
    transition: border-color 0.12s;
  }
  .card:hover { border-color: var(--text3); }
  .card-name {
    font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .card-cat { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
  .card-bottom { display: flex; align-items: center; gap: 6px; }
  .card-dist-text { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }

  .empty { text-align: center; padding: 3rem; color: var(--text3); font-size: 14px; }

  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

  .divider-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--dessert); text-transform: uppercase;
    font-family: 'DM Mono', monospace; margin-bottom: 0.75rem;
  }
</style>

  </div>

  <!-- Filters -->
  <div class="filter-row" id="dist-filters">
    <button class="filter-btn active" onclick="setDist('all',this)">전체 거리</button>
    <button class="filter-btn" onclick="setDist('d1',this)">🟢 ~300m</button>

  <!-- Lunch List -->

    <div class="count-badge" id="lunch-count"></div>

  <hr>

  <!-- Dessert List -->

  <div class="filter-row" id="dessert-dist-filters">
    <button class="filter-btn active" onclick="setDessertDist('all',this)">전체 거리</button>
    <button class="filter-btn" onclick="setDessertDist('d1',this)">🟢 ~300m</button>
    <button class="filter-btn" onclick="setDessertDist('d2',this)">🟡 ~500m</button>
    <button class="filter-btn" onclick="setDessertDist('d3',this)">🟠 ~1km</button>

  </div>
  <div class="section-header">
    <div class="section-title">카페 &amp; 디저트</div>
    <div class="count-badge" id="dessert-count"></div>
  </div>
  <div class="grid" id="dessert-grid"></div>

</div>

const BASE = { lat: 37.4858, lng: 127.0372 };
function deg2rad(d) { return d * Math.PI / 180; }
function calcDist(a, b) {
  const R = 6371000;
  const dLat = deg2rad(b.lat - a.lat);
  const dLng = deg2rad(b.lng - a.lng);
  const x = Math.sin(dLat/2)**2 + Math.cos(deg2rad(a.lat))*Math.cos(deg2rad(b.lat))*Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x)));
}
function distClass(m) {
  if (m <= 300) return 'd1';
  if (m <= 500) return 'd2';
  if (m <= 1000) return 'd3';
  return 'd4';
}
function distLabel(c) {
  return { d1:'🟢 300m 이내', d2:'🟡 300~500m', d3:'🟠 500m~1km', d4:'🔴 1km 이상' }[c];
}
function walkMin(m) { return Math.round(m / 70); }

const restaurants = raw.map(r => {
  const m = calcDist(BASE, {lat: r.lat, lng: r.lng});
  return { ...r, distM: m, distC: distClass(m) };
});

const lunchList = restaurants.filter(r => !DESSERT_CATS.includes(r.cat));
const dessertList = restaurants.filter(r => DESSERT_CATS.includes(r.cat));

let activeDist = 'all';
let activeCat = 'all';
let activeDessertDist = 'all';

// Cat filters (lunch only)
const allCats = [...new Set(lunchList.map(r => r.cat))].sort();
const cf = document.getElementById('cat-filters');
cf.innerHTML = `<button class="cat-btn active" onclick="setCat('all',this)">전체</button>` +
  allCats.map(c => `<button class="cat-btn" onclick="setCat('${c}',this)">${c}</button>`).join('');

function setDist(d, el) {
  activeDist = d;
  document.querySelectorAll('#dist-filters .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderLunch();
}
function setDessertDist(d, el) {
  activeDessertDist = d;
  document.querySelectorAll('#dessert-dist-filters .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderDessert();
}
function setCat(c, el) {
  activeCat = c;
  document.querySelectorAll('#cat-filters .cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderLunch();
}

function filteredLunch() {
  return lunchList.filter(r =>
    (activeDist === 'all' || r.distC === activeDist) &&
    (activeCat === 'all' || r.cat === activeCat)
  ).sort((a, b) => a.distM - b.distM);
}
function filteredDessert() {
  return dessertList.filter(r =>
    activeDessertDist === 'all' || r.distC === activeDessertDist
  ).sort((a, b) => a.distM - b.distM);
}

function cardHTML(r) {
  return `<div class="card">
    <div class="card-name" title="${r.name}">${r.name}</div>
    <div class="card-cat">${r.cat}</div>
    <div class="card-bottom">
      <span class="dist-badge ${r.distC}">${distLabel(r.distC)}</span>
      <span class="card-dist-text">${r.distM}m</span>
    </div>
  </div>`;
}

function renderLunch() {
  const list = filteredLunch();
  document.getElementById('lunch-count').textContent = `${list.length}개`;
  document.getElementById('lunch-grid').innerHTML = list.length
    ? list.map(cardHTML).join('')
    : '<div class="empty">해당 조건의 식당이 없어요</div>';
}
function renderDessert() {
  const list = filteredDessert();
  document.getElementById('dessert-count').textContent = `${list.length}개`;
  document.getElementById('dessert-grid').innerHTML = list.length
    ? list.map(cardHTML).join('')
    : '<div class="empty">해당 조건의 카페가 없어요</div>';
}

function pickLunch() {
  const list = filteredLunch();
  if (!list.length) return;
  const r = list[Math.floor(Math.random() * list.length)];
  document.getElementById('lunch-result').textContent = r.name;
  document.getElementById('lunch-meta').innerHTML =
    `<span style="color:var(--text2)">${r.cat}</span>
     <span class="dist-badge ${r.distC}">${distLabel(r.distC)}</span>
     <span style="font-size:11px;color:var(--text3)">도보 약 ${walkMin(r.distM)}분 (${r.distM}m)</span>`;
}
function pickDessert() {
  const list = filteredDessert().filter(r =>
    activeDessertDist === 'all' || r.distC === activeDessertDist
  );
  if (!list.length) return;
  const r = list[Math.floor(Math.random() * list.length)];
  document.getElementById('dessert-result').textContent = r.name;
  document.getElementById('dessert-meta').innerHTML =
    `<span style="color:var(--text2)">${r.cat}</span>
     <span class="dist-badge dd">☕ 디저트</span>
     <span style="font-size:11px;color:var(--text3)">도보 약 ${walkMin(r.distM)}분 (${r.distM}m)</span>`;
}

renderLunch();
renderDessert();
</script>
